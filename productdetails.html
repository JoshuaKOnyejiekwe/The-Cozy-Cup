<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Product Details</title> <link rel="stylesheet" href="productdetails.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <link rel="stylesheet" href="auth.css"> </head> <body> <!-- Navbar + Auth Modal injected by navbar.js --> <nav class="flexboxnavi"> <div class="nav-left"> <a href="/" class="flexboxnaviitems">Home</a> <a href="/menu.html" class="flexboxnaviitems">Menu</a> <a href="#" class="flexboxnaviitems">Rewards</a> <a href="#" class="flexboxnaviitems">Gift Cards</a> </div> <div class="nav-right"> <input type="text" placeholder="Search..." class="search-bar"> <a href="#" class="flexboxnaviitems">Find a store</a> <a href="#" class="flexboxnaviitems">Sign in</a> <a href="#" class="flexboxnaviitems join">Join Now</a> <span class="flexboxnaviitems hidden" id="nav-user"></span> <a href="#" class="flexboxnaviitems hidden" id="nav-signout">Sign Out</a> </div> </nav> <div class="product-page"> <div class="image-card"> <img id="product-img" src="" alt="" class="product-img"> </div> <div class="product-info"> <h1 id="product-name"></h1> <div class="product-desc-box"> <h4>Description</h4> <p id="product-desc"></p> </div> <h2 class="price" id="product-price"></h2> </div> </div> <!-- ===== JS ===== --> <script type="module"> import { renderNavbar } from "./navbar.js"; import { getMenuItem } from "./firebase.js"; import "./auth.js"; // Render shared navbar + auth modal renderNavbar(); // Fetch and display product details (Firestore) (async () => { const urlParams = new URLSearchParams(window.location.search); const productId = urlParams.get('id'); if (!productId) { document.querySelector('.product-page').innerHTML = '<h1>Product not found</h1>'; return; } const product = await getMenuItem(productId); if (product) { document.getElementById('product-img').src = product.image; document.getElementById('product-img').alt = product.name; document.getElementById('product-name').textContent = product.name; document.getElementById('product-desc').textContent = product.description; document.getElementById('product-price').textContent = `$${product.price.toFixed(2)}`; } else { document.querySelector('.product-page').innerHTML = '<h1>Product not found</h1>'; } })(); </script> </body> </html>
